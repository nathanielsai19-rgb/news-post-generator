name: generate-video

on:
  workflow_dispatch: {}
  schedule:
    # Backup cadence (every 4h); cron-job.org dispatch is the primary trigger.
    - cron: "23 */4 * * *"

permissions:
  contents: write

concurrency:
  group: generate-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The ALLOW_VIDEO_GEN gate lives inside the script: when off, it only
      # writes the production pack (zero LTX cost). secrets can't be used in
      # `if` expressions, so the script is the gate.
      - name: Install ffmpeg (for vision QA frames)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generate video
        env:
          LTX_API_KEY: ${{ secrets.LTX_API_KEY }}
          ALLOW_VIDEO_GEN: ${{ secrets.ALLOW_VIDEO_GEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/generate_video.py

      - name: Commit results
        run: |
          git config user.name "inkdrop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add videos/ video.json video_history.json production.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: video pipeline run"
            git push
          fi
