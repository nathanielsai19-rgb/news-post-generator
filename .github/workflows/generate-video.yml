name: generate-video

on:
  workflow_dispatch: {}
  schedule:
    # Backup cadence (every 4h); cron-job.org dispatch is the primary trigger.
    - cron: "23 */4 * * *"

permissions:
  contents: write

concurrency:
  group: generate-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cloud runs only write the production pack + scene spec (zero render
      # cost). Rendering happens locally: ALLOW_VIDEO_GEN=true python
      # scripts/generate_video.py on the PC with Blender installed.
      - name: Install ffmpeg (unused in standby; kept for completeness)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generate video
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_video.py

      - name: Commit results
        run: |
          git config user.name "inkdrop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: video pipeline run"
            git push
          fi
